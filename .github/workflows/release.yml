name: release

on:
  push:
    tags:
      # Both forms are accepted; the leading `v` is stripped before use so
      # the published tag always matches config.yaml's `version`.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7

      # The Supervisor pulls `<image>:<version>` using the `version` field
      # from config.yaml, so the pushed tag has to match it exactly. A `v`
      # prefix on the git tag would publish an image nobody can pull, and a
      # config.yaml that was never bumped would leave users on the old
      # version with no update prompt. Fail before building rather than
      # publishing something unusable.
      #
      # Plain grep/sed rather than yq so this can run before any tooling is
      # set up. Kept POSIX-portable (no GNU-only `\?`) so the same command
      # can be checked on a developer machine.
      - name: Resolve and verify version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version:' home-curator/config.yaml \
            | sed 's/^version:[[:space:]]*//; s/^"//; s/"$//')
          if [ "$version" != "$declared" ]; then
            echo "::error::git tag '$GITHUB_REF_NAME' implies version" \
                 "'$version', but home-curator/config.yaml declares" \
                 "'$declared'. Bump config.yaml and commit it to main" \
                 "before tagging."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing version $version"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # src/api/generated.ts is gitignored and the frontend build stage needs
      # it, so it is generated here from the backend's OpenAPI schema.
      #
      # Produced in-process rather than by starting a server: the previous
      # approach booted uvicorn against fake HA credentials and slept for a
      # fixed 5 seconds, which only worked because routes are registered
      # outside the lifespan, and would have raced on a slow runner.
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Generate the frontend API client
        run: |
          uv sync --all-extras --directory apps/backend
          cd apps/frontend
          npm ci
          npm run gen:api:local

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: home-curator/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/home-curator-${{ matrix.arch }}:${{ env.VERSION }}
