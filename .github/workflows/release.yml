name: release

on:
  push:
    tags:
      # Both forms are accepted; the leading `v` is stripped before use so
      # the published tag always matches config.yaml's `version`.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v7

      # The Supervisor pulls `<image>:<version>` using the `version` field
      # from config.yaml, so the pushed tag has to match it exactly. A `v`
      # prefix on the git tag would publish an image nobody can pull, and a
      # config.yaml that was never bumped would leave users on the old
      # version with no update prompt. Fail before building rather than
      # publishing something unusable.
      #
      # Plain grep/sed rather than yq so this can run before any tooling is
      # set up. Kept POSIX-portable (no GNU-only `\?`) so the same command
      # can be checked on a developer machine.
      - name: Resolve and verify version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version:' home-curator/config.yaml \
            | sed 's/^version:[[:space:]]*//; s/^"//; s/"$//')
          if [ "$version" != "$declared" ]; then
            echo "::error::git tag '$GITHUB_REF_NAME' implies version" \
                 "'$version', but home-curator/config.yaml declares" \
                 "'$declared'. Bump config.yaml and commit it to main" \
                 "before tagging."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing version $version"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate the frontend's API types from a local backend run so the
      # Docker build sees the real contract.
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - name: Start backend to produce OpenAPI spec
        working-directory: apps/backend
        env:
          HA_URL: http://localhost:8123
          HA_TOKEN: fake
        run: |
          uv sync --all-extras
          nohup uv run uvicorn home_curator.main:app --port 8099 > /tmp/uvicorn.log 2>&1 &
          sleep 5
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - name: Generate frontend API types
        working-directory: apps/frontend
        run: |
          npm ci
          npm run gen:api

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: home-curator/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/home-curator-${{ matrix.arch }}:${{ env.VERSION }}
