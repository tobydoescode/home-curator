name: backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor pyproject.toml declares, and the version CI and the
        # runtime image actually use. Testing only the newest meant a
        # 3.13+ feature could slip past the declared minimum.
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      # Documented in apps/backend/README.md as part of the workflow but never
      # run here, so it had been failing unnoticed.
      - run: uv run mypy src
      - run: uv run pytest -v
