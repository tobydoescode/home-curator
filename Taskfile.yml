version: "3"

dotenv: [".env"]

vars:
  BACKEND_DIR: apps/backend
  FRONTEND_DIR: apps/frontend

tasks:
  default:
    desc: List available tasks
    silent: true
    cmd: task --list

  # --- One-time setup -----------------------------------------------------

  setup:
    desc: Install deps, seed policies.yaml, run migrations
    cmds:
      - task: setup:backend
      - task: setup:frontend

  setup:backend:
    desc: Install backend deps, seed default policies, run migrations
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv sync --all-extras
      - mkdir -p .dev-config/home-curator .dev-data
      - |
        if [ ! -f .dev-config/home-curator/policies.yaml ]; then
          cp tests/fixtures/sample_policies.yaml .dev-config/home-curator/policies.yaml
          echo "Seeded .dev-config/home-curator/policies.yaml"
        fi
      - uv run alembic upgrade head

  setup:frontend:
    desc: Install frontend deps
    dir: "{{.FRONTEND_DIR}}"
    cmd: npm install

  # --- Dev servers --------------------------------------------------------

  backend:
    desc: "Run FastAPI on :8099 (reads HA_URL/HA_TOKEN from .env)"
    dir: "{{.BACKEND_DIR}}"
    cmd: uv run uvicorn home_curator.main:app --reload --port 8099

  frontend:
    desc: "Run Vite dev server on :5173 (proxies /api to :8099)"
    dir: "{{.FRONTEND_DIR}}"
    cmd: npm run dev

  dev:
    desc: Run backend + frontend together (Ctrl-C stops both)
    deps: [backend, frontend]

  # --- API client regeneration --------------------------------------------

  gen-api:
    desc: Regenerate src/api/generated.ts (backend must be running)
    dir: "{{.FRONTEND_DIR}}"
    cmd: npm run gen:api

  # --- Verification -------------------------------------------------------

  test:
    desc: Run the full test suite (backend + frontend)
    cmds:
      - task: test:backend
      - task: test:frontend

  test:backend:
    dir: "{{.BACKEND_DIR}}"
    cmd: env -u HA_URL -u HA_TOKEN -u SUPERVISOR_TOKEN uv run pytest -q

  test:frontend:
    dir: "{{.FRONTEND_DIR}}"
    cmd: npm run test:run

  test:realha:
    desc: Run the suite against a real Home Assistant container (needs Docker, slow)
    dir: "{{.BACKEND_DIR}}"
    cmd: >-
      env -u HA_URL -u HA_TOKEN -u SUPERVISOR_TOKEN
      uv run --all-extras --group realha pytest -m realha -v

  test:e2e:
    desc: Run the fake-ingress browser suite (builds the frontend first)
    deps: [build:frontend]
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run --all-extras --group e2e playwright install chromium
      - >-
        env -u HA_URL -u HA_TOKEN -u SUPERVISOR_TOKEN
        uv run --all-extras --group e2e pytest -m e2e -v

  build:frontend:
    desc: Build the production frontend bundle into apps/frontend/dist
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run gen:api:local
      - npm run build

  gen-api:local:
    desc: Regenerate the typed API client in-process (no running backend needed)
    dir: "{{.FRONTEND_DIR}}"
    cmd: npm run gen:api:local

  # --- Addon image ---------------------------------------------------------

  addon:image:
    desc: Build the addon Docker image locally (same Dockerfile the release uses)
    deps: [gen-api:local]
    cmd: docker build -f home-curator/Dockerfile -t home-curator-dev:local .

  addon:verify:
    desc: Build the addon image and check the things that have broken before
    deps: [addon:image]
    cmds:
      - |
        docker run --rm --entrypoint /bin/sh home-curator-dev:local -c \
          'cd /app && PYTHONPATH=/app/src ./.venv/bin/python -c "
        import celpy, re2
        from home_curator.main import create_app
        assert create_app().openapi()[\"paths\"]
        print(\"app and native deps import: ok\")"'
      - |
        docker run --rm --entrypoint /bin/sh home-curator-dev:local -c \
          'ls /app/.venv/bin/ | grep -qE "^(pytest|mypy|ruff)$"' \
          && { echo "FAIL: dev tooling leaked into the runtime image"; exit 1; } \
          || echo "no dev tooling in runtime image: ok"
      - |
        docker run --rm --entrypoint /bin/sh home-curator-dev:local -c \
          'grep -q "src=\"/assets/" /app/static/index.html' \
          && { echo "FAIL: absolute asset paths break ingress"; exit 1; } \
          || echo "frontend assets relative: ok"

  coverage:
    desc: Calculate backend + frontend test coverage
    cmds:
      - task: coverage:backend
      - task: coverage:frontend

  coverage:backend:
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - env -u HA_URL -u HA_TOKEN -u SUPERVISOR_TOKEN uv run coverage run --source=home_curator -m pytest
      - uv run coverage report --show-missing

  coverage:frontend:
    dir: "{{.FRONTEND_DIR}}"
    cmd: npm run test:coverage

  typecheck:
    desc: TypeScript typecheck
    dir: "{{.FRONTEND_DIR}}"
    cmd: npm run typecheck

  # --- Housekeeping -------------------------------------------------------

  clean:
    desc: Remove build artifacts (node_modules, .venv, .dev-data, dist)
    cmds:
      - rm -rf {{.FRONTEND_DIR}}/node_modules {{.FRONTEND_DIR}}/dist
      - rm -rf {{.BACKEND_DIR}}/.venv {{.BACKEND_DIR}}/.dev-data
      - 'echo "Kept .dev-config/home-curator/policies.yaml — delete manually if you want defaults back."'
