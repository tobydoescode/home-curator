name: Home Curator
version: "0.1.0"
slug: home-curator
description: Keep your Home Assistant instance tidy — misconfiguration detection and mass updates.
url: "https://github.com/tobydoescode/ha-app-home-curator"
# 32-bit ARM is deliberately absent. Home Assistant dropped all 32-bit
# architectures in 2025.12, and HAOS 17.0 removed the armv7 Raspberry Pi
# targets outright, so no supported installation runs it. It is also not
# buildable: the newest addon base image publishing an armv7 manifest ships
# Python 3.11 (this project needs 3.12+) and has no re2-dev, which
# cel-python's google-re2 dependency requires on musl.
# Raspberry Pi 4 and 5 run the 64-bit aarch64 image.
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
# `homeassistant_api` grants the Supervisor proxy to Home Assistant core,
# which is what the websocket client connects through. The Supervisor's own
# API (`hassio_api`) is deliberately not requested — nothing calls it.
homeassistant_api: true
# The addon's own private config directory, not Home Assistant's.
#
# This used to be `config:rw`, which granted read/write over the whole of
# `/config` — secrets.yaml, configuration.yaml, the database — in order to
# store a single policies.yaml. `addon_config` is backed by
# `/addon_configs/<slug>/` on the host, still browsable with the File Editor
# or Samba addons, but nothing outside this addon's own files is reachable.
#
# `path` is stated explicitly rather than relying on the default, which is
# documented inconsistently (`/config` in one place, `/<type-name>` in
# another).
map:
  - type: addon_config
    read_only: false
    path: /config
ingress: true
ingress_port: 8099
panel_icon: mdi:broom
panel_title: Home Curator
image: "ghcr.io/tobydoescode/home-curator-{arch}"
