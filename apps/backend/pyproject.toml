[project]
name = "home-curator"
version = "0.1.0"
description = "Home Assistant addon for tidying up your instance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "ruamel.yaml>=0.18",
    "watchfiles>=0.21",
    "cel-python>=0.3",
    "websockets>=12.0",
    "httpx>=0.27",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
]

[dependency-groups]
# Only needed to run the real-Home-Assistant suite (`task test:realha`).
# A dependency group rather than an extra so `uv sync --no-dev` keeps it out
# of the production image.
realha = [
    "testcontainers>=4.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/home_curator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# The real-HA suite needs Docker and takes minutes, so it is opt-in.
# `task test:realha` overrides this with an explicit `-m realha`.
addopts = "-m 'not realha'"
markers = [
    "realha: runs against a real Home Assistant container (requires Docker)",
]
# Fixture code for the HA container imports `homeassistant`, which is not a
# dependency of this project — keep it away from collection.
norecursedirs = ["tests/realha/fixtures"]
filterwarnings = [
    "error::DeprecationWarning:home_curator.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Runs inside the Home Assistant container against HA's own API surface, not
# in this project's virtualenv.
extend-exclude = ["tests/realha/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/realha/fixtures"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
