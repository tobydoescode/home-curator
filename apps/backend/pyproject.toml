[project]
name = "home-curator"
version = "0.1.0"
description = "Home Assistant addon for tidying up your instance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "ruamel.yaml>=0.18",
    "watchfiles>=0.21",
    "cel-python>=0.3",
    # Imported directly by `user_regex`, not only pulled in by cel-python.
    # Declared so a future cel-python release dropping it cannot silently
    # break user-supplied pattern compilation.
    "google-re2>=1.1",
    "websockets>=12.0",
    "httpx>=0.27",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
]

[dependency-groups]
# Only needed to run the real-Home-Assistant suite (`task test:realha`).
# A dependency group rather than an extra so `uv sync --no-dev` keeps it out
# of the production image.
realha = [
    "testcontainers>=4.8",
]
# Only needed to run the fake-ingress browser suite (`task test:e2e`).
e2e = [
    "pytest-playwright>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/home_curator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# The real-HA and fake-ingress suites need Docker / a built frontend / a
# browser, so both are opt-in. `task test:realha` and `task test:e2e`
# override this with an explicit `-m`.
addopts = "-m 'not realha and not e2e'"
markers = [
    "realha: runs against a real Home Assistant container (requires Docker)",
    "e2e: drives the built frontend behind a fake ingress (requires a built dist)",
]
# Fixture code for the HA container imports `homeassistant`, which is not a
# dependency of this project — keep it away from collection.
norecursedirs = ["tests/realha/fixtures"]
filterwarnings = [
    "error::DeprecationWarning:home_curator.*",
]

[tool.mypy]
# `strict` rather than a hand-picked subset: the codebase is already almost
# fully typed, so the whole set cost ~38 fixes, nearly all of them missing
# annotations. Pinned to the minimum supported interpreter, not CI's, so
# 3.12-incompatible typing cannot slip through.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# celpy ships no type information; without this, importing it makes every
# expression that touches it Any and `strict` reports the module as missing.
module = ["celpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-re2 ships no type information either. The blast radius is one module:
# `user_regex` casts to its own `UserPattern` protocol at the boundary, so no
# other file sees an untyped pattern object.
module = ["re2"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Runs inside the Home Assistant container against HA's own API surface, not
# in this project's virtualenv.
extend-exclude = ["tests/realha/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# Pyright is configured in the repo-root `pyrightconfig.json`, which takes
# precedence over this file when both exist. A `[tool.pyright]` section here
# was therefore dead config, and had already drifted from the live one.
